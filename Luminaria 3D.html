<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Luminaria 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: estudio oscuro de tres columnas (biblioteca | visor 3D | propiedades). Acento: ámbar tungsteno. */
:root{--bg:#0c0e12;--panel:#14171d;--panel2:#1b1f27;--line:#272c36;--fg:#e8eaef;--mut:#8d95a5;--amber:#ffb347;--amber2:#3a2a12;--red:#ff6b5e;
--ui:'Barlow Semi Condensed',system-ui,sans-serif;--disp:'Barlow Condensed',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding-block:10px}
#top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{font:700 22px/1 var(--disp);letter-spacing:.14em;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;color:var(--amber)}
.mark{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--amber) 45%,transparent 70%);box-shadow:0 0 12px var(--amber)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);border-radius:0}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--amber);color:#1a1205}
.actions{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;min-height:32px}
button:hover{border-color:#3b4250}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
select,input[type=number],input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-height:32px;width:100%;min-width:0}
input[type=color]{width:100%;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px}
input[type=range]{width:100%;accent-color:var(--amber)}
#main{display:grid;grid-template-columns:262px minmax(0,1fr) 300px;gap:10px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:0;min-width:0;display:flex;flex-direction:column}
.panel h3{margin:0;font:700 13px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);padding:12px 12px 8px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;color:var(--mut);font:700 14px var(--disp);letter-spacing:.1em;text-transform:uppercase;padding:10px 4px}
.tabs button.on{color:var(--amber);box-shadow:inset 0 -2px var(--amber)}
.scroll{overflow:auto;min-height:0;flex:1;padding:8px 10px 12px}
.cat{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:10px 2px 6px}
.card{display:block;width:100%;text-align:left;margin-bottom:5px;padding:7px 10px}
.card b{display:block;font-weight:600}
.card small{font:400 11px var(--mono);color:var(--mut)}
#libList{flex:1;min-height:0;display:flex;flex-direction:column}
#outl{border-top:1px solid var(--line);max-height:34%;display:flex;flex-direction:column;min-height:90px}
.orow{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-radius:4px;background:transparent;padding:4px 6px;min-height:26px}
.orow.on{background:var(--amber2);color:var(--amber)}
.orow .k{font:500 10px var(--mono);border:1px solid var(--line);border-radius:3px;padding:1px 4px;color:var(--mut)}
.orow em{margin-left:auto;font:400 10px var(--mono);color:var(--amber);font-style:normal}
.orow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vp{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#050608;min-height:0;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#frame{position:absolute;pointer-events:none}
#frame.pip{border:1px solid var(--amber);box-shadow:0 0 0 1px #000}
#frame.big{border:1px solid rgba(255,179,71,.6);--g:rgba(255,255,255,.2)}
#frame.big::before,#frame.big::after{content:"";position:absolute;inset:0}
#frame.big::before{background:linear-gradient(90deg,transparent calc(33.333% - 1px),var(--g) calc(33.333% - 1px) 33.333%,transparent 33.333% calc(66.666% - 1px),var(--g) calc(66.666% - 1px) 66.666%,transparent 66.666%)}
#frame.big::after{background:linear-gradient(180deg,transparent calc(33.333% - 1px),var(--g) calc(33.333% - 1px) 33.333%,transparent 33.333% calc(66.666% - 1px),var(--g) calc(66.666% - 1px) 66.666%,transparent 66.666%)}
#frame .tag{position:absolute;left:6px;top:5px;font:500 11px var(--mono);background:rgba(0,0,0,.6);color:var(--amber);padding:2px 6px;border-radius:3px;white-space:nowrap;z-index:1}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,8px);font:500 10px/1.2 var(--mono);color:#dfe3ea;background:rgba(10,12,16,.72);padding:2px 5px;border-radius:3px;white-space:nowrap}
.lbl.on{color:var(--amber)}
#hint{position:absolute;left:10px;bottom:8px;font:400 11px var(--mono);color:var(--mut);pointer-events:none;max-width:70%}
#msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mut);padding:20px;pointer-events:none}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--amber);padding:8px 14px;border-radius:6px;z-index:20;font-size:13px}
.f{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px}
.fl{font-size:12px;color:var(--mut)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.rng{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:6px;align-items:center}
.rng output{font:400 11px var(--mono);text-align:right;color:var(--amber)}
.sec{font:700 12px var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin:14px 0 8px;border-top:1px solid var(--line);padding-top:10px}
.sec:first-child{border-top:0;margin-top:2px;padding-top:0}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.meter{white-space:pre-line;font:500 12px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--amber);margin-bottom:8px}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:13px}
.chk input{accent-color:var(--amber);width:16px;height:16px}
.note{font-size:12px;color:var(--mut);margin:6px 0}
@media (max-width:959px){
 html,body{height:auto}
 #app{height:auto}
 #main{display:flex;flex-direction:column}
 #vp{height:62vh;min-height:340px;order:0}
 #side{order:1}
 #lib{order:2;max-height:none}
 #libList{max-height:360px}
 .actions{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pro{font:600 10px var(--mono);letter-spacing:.1em;color:#1a1205;background:var(--amber);border-radius:3px;padding:2px 5px;align-self:flex-start}
button.render{border-color:var(--amber);color:var(--amber)}
button.render.on{background:var(--amber);color:#1a1205}
#rprog{font:500 11px var(--mono);color:var(--amber);min-width:64px}
.badge{display:inline-block;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px;color:var(--mut)}
.badge.ok{color:#7fd69a;border-color:#2c5a3b}
.spec{font:400 11px/1.55 var(--mono);color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px;white-space:pre-line}
.spec b{color:var(--amber);font-weight:500}
.drop{border:1px dashed var(--line);border-radius:6px;padding:10px;text-align:center;color:var(--mut);font-size:12px;margin:6px 0 10px}
.drop.over{border-color:var(--amber);color:var(--amber)}
.card,.cat,.orow{flex-shrink:0}
.card b{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.card b .badge{margin-left:0}
#scene{max-height:44%;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#scene>.sec,#scene>.f,#scene>.meter{grid-column:1/-1}
#scene .chk{margin-bottom:4px}
</style>

 <header id="top">
  <div class="brand"><span class="mark"></span>LUMINARIA <i>3D</i><small class="pro">PRO</small></div>
  <div class="seg" id="viewSeg"><button data-v="studio" class="on">Estudio</button><button data-v="planta">Planta</button><button data-v="camara">Cámara</button></div>
  <div class="seg" id="modeSeg"><button data-m="translate" class="on">Mover</button><button data-m="rotate">Rotar</button><button data-m="scale">Escalar</button></div>
  <div class="actions">

   <select id="preset" aria-label="Escenas de ejemplo" style="width:auto"><option value="">Escenas…</option><option value="interview">Entrevista de 3 puntos</option><option value="empty">Estudio vacío</option></select>
   <button id="save">Guardar</button><button id="load">Cargar</button>
  </div>
 </header>
 <main id="main">
  <aside id="lib" class="panel">
   <div class="tabs" id="tabs"><button data-t="light" class="on">Luces</button><button data-t="obj">Modelos</button><button data-t="cam">Cámaras</button></div>
   <div id="libList" class="scroll"></div>
   <div id="outl"><h3>En escena</h3><div class="scroll" id="outList"></div></div>
  </aside>
  <section id="vp">
   <canvas id="cv"></canvas>
   <div id="labels"></div>
   <div id="frame" hidden><span class="tag"></span></div>
   <div id="msg" hidden></div>
   <div id="hint">Clic: seleccionar · Arrastrar: orbitar · Rueda: zoom · W / E / R · Supr: borrar · Arrastra un .glb aquí para importarlo</div>
  </section>
  <aside id="side" class="panel">
   <h3>Propiedades</h3>
   <div class="scroll" id="props"></div>
   <div id="scene" style="border-top:1px solid var(--line);padding:10px 10px 12px">
    <div class="sec" style="margin-top:0;border:0;padding:0">Escena y exposición</div>
    <div class="f"><span class="fl">Ambiente</span><div class="rng"><input id="amb" type="range" min="0" max="300" step="1" value="25"><output id="ambO"></output></div></div>
    <div class="f"><span class="fl">Suelo</span><select id="floorSel"><option value="gris">Gris estudio</option><option value="madera">Madera</option><option value="concreto">Concreto</option><option value="blanco">Cicloramas blanco</option><option value="negro">Negro mate</option></select></div>
    <label class="chk"><input type="checkbox" id="oGrid" checked>Cuadrícula</label>
    <label class="chk"><input type="checkbox" id="oHelp" checked>Guías</label>
    <label class="chk"><input type="checkbox" id="oLbl">Etiquetas</label>
    <label class="chk"><input type="checkbox" id="oPip" checked>Mini-vista</label>
    <label class="chk"><input type="checkbox" id="oSnap">Imán 10 cm</label>
    <div class="meter" id="sceneMeter">—</div>
   </div>
  </aside>
 </main>
</div>
<div id="toast" hidden></div>
